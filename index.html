<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trade Marketing · DeliDips</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --surface-2:#F6F7F8; --ink:#17191E; --muted:#636873; --line:#DADDE2;
  --brand:#B5000B; --brand-ink:#FFFFFF;
  --hummus:#E9820C; --salsas:#B5000B; --pan:#A97A36;
  --ok:#1E7F4E; --warn:#C27A00; --bad:#D0281C; --info:#2F5DA8;
  --ok-bg:#E3F3EA; --warn-bg:#FBF0DA; --bad-bg:#FBE4E1; --info-bg:#E4ECF8;
  --weekend:#F2F3F5; --today:#B5000B;
  --shadow:0 1px 0 rgba(23,25,30,.06);
  --logo-bg:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --surface:#1B1E23; --surface-2:#22262C; --ink:#ECEDEF; --muted:#9CA1AB; --line:#2F343B;
    --brand:#E0333B; --hummus:#F29A33; --salsas:#E0333B; --pan:#C9995A;
    --ok:#5CC48F; --warn:#E5A93A; --bad:#FF6B5E; --info:#7FA6E8;
    --ok-bg:#183326; --warn-bg:#3A2E14; --bad-bg:#3D1C19; --info-bg:#1B2840;
    --weekend:#181B1F; --today:#FF5A5F; --logo-bg:#F4F4F4; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1B1E23; --surface-2:#22262C; --ink:#ECEDEF; --muted:#9CA1AB; --line:#2F343B;
  --brand:#E0333B; --hummus:#F29A33; --salsas:#E0333B; --pan:#C9995A;
  --ok:#5CC48F; --warn:#E5A93A; --bad:#FF6B5E; --info:#7FA6E8;
  --ok-bg:#183326; --warn-bg:#3A2E14; --bad-bg:#3D1C19; --info-bg:#1B2840;
  --weekend:#181B1F; --today:#FF5A5F; --logo-bg:#F4F4F4; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
a{color:var(--info)}

/* top */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1400px;margin:0 auto;padding:10px 20px 0;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:12px;padding-bottom:10px}
.brandmark img{height:40px;background:var(--logo-bg);border-radius:6px;padding:3px 5px}
.brandmark div{line-height:1.1}
.brandmark strong{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;display:block}
.brandmark span{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:8px 10px 12px;font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
nav.tabs .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--bad);color:#fff;font-size:13px;line-height:20px;text-align:center;font-family:"Barlow",sans-serif}
.brandmark .conn{display:block;font-size:12px;color:var(--muted)}
.brandmark .conn.local{color:var(--warn)}

main{max-width:1400px;margin:0 auto;padding:20px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav h2{margin:0 8px;font-size:34px;font-weight:700;line-height:1;min-width:200px;text-transform:capitalize}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1;display:inline-grid;place-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:3px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:default}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
select,input[type=text],input[type=number],input[type=date],textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 8px;cursor:pointer;font-size:14px}
.chip .sw{width:10px;height:10px;border-radius:3px}
.chip[aria-pressed="false"]{opacity:.45}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h3{margin:0;font-size:22px;font-weight:600}
.panel-b{padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.kpi{background:var(--surface);padding:12px 16px}
.kpi b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:32px;line-height:1.1;font-weight:700}
.kpi span{font-size:13px;color:var(--muted)}

/* Gantt */
.gantt-wrap{overflow-x:auto}
.gantt{min-width:980px}
.g-row{display:grid;position:relative;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-head{position:sticky;top:0;background:var(--surface);z-index:3}
.g-head .d{font-size:12px;text-align:center;color:var(--muted);padding:6px 0;line-height:1.15}
.g-head .d b{display:block;font-size:15px;color:var(--ink);font-family:"Barlow Condensed",sans-serif}
.g-head .d.today b{color:#fff;background:var(--today);border-radius:6px;margin:0 3px}
.g-label{grid-column:1;display:flex;align-items:center;gap:8px;padding:8px 10px;border-right:1px solid var(--line);background:var(--surface);position:sticky;left:0;z-index:2}
.g-label img{height:28px;max-width:128px;object-fit:contain;background:var(--logo-bg);border-radius:4px;padding:2px}
.g-cell{border-left:1px solid transparent}
.g-cell.we{background:var(--weekend)}
.g-cell.today{box-shadow:inset 2px 0 0 var(--today)}
.bar{position:relative;z-index:1;margin:3px 2px;border-radius:6px;padding:0 8px;font-size:13px;line-height:24px;height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#fff;font-weight:500;border:2px solid transparent;text-align:left}
.bar.c-hummus{background:var(--hummus)} .bar.c-salsas{background:var(--salsas)} .bar.c-panificados{background:var(--pan)}
.bar.plan{background:var(--surface)!important;border-style:dashed}
.bar.c-delidips{background:var(--dd)}
.bar.c-aconfirmar{background:repeating-linear-gradient(135deg,var(--tbd) 0 8px,var(--tbd2) 8px 16px)}
.bar.plan.c-aconfirmar{border-color:var(--tbd);color:var(--tbd)}
.bar.plan.c-delidips{border-color:var(--dd);color:var(--dd)}
.bar.plan.c-hummus{border-color:var(--hummus);color:var(--hummus)} .bar.plan.c-salsas{border-color:var(--salsas);color:var(--salsas)} .bar.plan.c-panificados{border-color:var(--pan);color:var(--pan)}
.bar.cancel{opacity:.35;text-decoration:line-through}
.bar .st{display:inline-block;margin-right:5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:22px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}

/* month grid */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}
.mgrid .wd{padding:6px 8px;font-size:13px;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.mgrid .day{min-height:110px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
.mgrid .day.out{background:var(--surface-2);color:var(--muted)}
.mgrid .day .n{font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:600;padding:0 4px}
.mgrid .day.today .n{color:#fff;background:var(--today);border-radius:6px;display:inline-block}
.mgrid .pill{display:block;width:100%;text-align:left;border:0;margin:2px 0;padding:1px 6px;border-radius:4px;font-size:12px;color:#fff;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-wrap{overflow-x:auto}
.cc{min-width:760px;border-top:1px solid var(--line)}
.cc-title{text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:44px;line-height:1.1;padding:14px 0 10px;text-transform:uppercase;letter-spacing:.02em;border-bottom:1px solid var(--line)}
.cc-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.cc-head div{text-align:center;font-weight:600;font-size:14px;padding:6px 0;border-right:1px solid var(--line)}
.cc-head div:last-child,.cc-wk .cc-day:nth-of-type(7n){border-right:0}
.cc-wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:128px;border-bottom:1px solid var(--line)}
.cc-wk:last-child{border-bottom:0}
.cc-day{border-right:1px solid var(--line);background:var(--surface)}
.cc-day.we{background:var(--weekend)}
.cc-day.out{background:var(--surface-2)}
.cc-day.k-comercial{background:var(--key-bg)}.cc-day.k-feriado{background:var(--hol-bg)}.cc-day.k-interna{background:var(--own-bg)}
.cc-top{position:relative;z-index:1;padding:4px 6px 2px;display:flex;flex-direction:column;align-items:stretch;min-width:0;pointer-events:none}
.cc-top>*{pointer-events:auto}
.cc-n{align-self:flex-end;font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600;line-height:1.2;min-width:26px;text-align:center;border-radius:6px}
.cc-day.out+.cc-top .cc-n{color:var(--muted);opacity:.6}
.cc-n.today{background:var(--today);color:#fff}
.cc-top .klabel{padding:0}
.cc-bar{margin:1px 3px;height:24px;line-height:20px;font-size:12px;display:flex;align-items:center;gap:5px;padding:0 6px}
.cc-bar img{height:14px;max-width:44px;object-fit:contain;background:#fff;border-radius:3px;padding:1px 2px;flex:none}
.cc-bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.cc-bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
.tbl-wrap{overflow-x:auto}
.catdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.info{background:var(--info-bg);color:var(--info)} .tag.neutral{background:var(--surface-2);color:var(--muted)}
.minilogo{height:20px;max-width:70px;object-fit:contain;vertical-align:middle;background:var(--logo-bg);border-radius:3px;padding:1px 2px}

/* clipping */
.chains{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chainbtn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px 8px;cursor:pointer;min-width:118px;position:relative}
.chainbtn img{height:30px;max-width:100px;object-fit:contain;background:var(--logo-bg);border-radius:4px;padding:2px 4px}
.chainbtn span{font-size:12px;color:var(--muted)}
.chainbtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--brand)}
.chainbtn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.daystrip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(30px,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.daystrip button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 0;cursor:pointer;font-size:12px;color:var(--muted);line-height:1.2}
.daystrip button b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:16px;color:var(--ink)}
.daystrip button.has{background:var(--info-bg);border-color:var(--info)}
.daystrip button.has i{display:block;font-style:normal;color:var(--info);font-weight:600}
.daystrip button[aria-pressed="true"]{outline:2px solid var(--ink)}
.daystrip button.future{opacity:.4}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--brand);background:var(--bad-bg)}
.drop strong{font-family:"Barlow Condensed",sans-serif;font-size:22px;display:block}
.cliplayout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:1000px){.cliplayout{grid-template-columns:1fr}}
.capture.noimgcard{grid-template-columns:minmax(0,1fr)}
.capture{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
@media (max-width:700px){.capture{grid-template-columns:1fr}}
.capture .img{background:var(--surface-2);border-right:1px solid var(--line);display:flex;align-items:flex-start;justify-content:center;max-height:420px;overflow:hidden;cursor:zoom-in}
.capture .img img{width:100%;height:auto;display:block}
.capture .body{padding:12px 14px;min-width:0}
.capture .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.capture .meta b{font-family:"Barlow Condensed",sans-serif;font-size:19px}
.capture .sum{font-size:14px;color:var(--muted);margin:0 0 8px}
.capture table.t td,.capture table.t th{padding:6px 8px}
.capture input{width:100%;padding:4px 6px;font-size:13px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.side h4{margin:0 0 8px;font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600}
.planitem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.planitem:last-child{border-bottom:0}
.planitem .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px}
.ic.ok{background:var(--ok-bg);color:var(--ok)} .ic.bad{background:var(--bad-bg);color:var(--bad)} .ic.neutral{background:var(--surface-2);color:var(--muted)}

/* PSV */
.alerts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:18px}
.alert{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:10px;padding:12px 14px}
.alert.warn{border-left-color:var(--warn)}
.alert.done{opacity:.6}
.alert .pct{font-family:"Barlow Condensed",sans-serif;font-size:36px;font-weight:700;line-height:1;color:var(--bad)}
.alert.warn .pct{color:var(--warn)}
.alert .row{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.alert .prod{font-weight:600}
.psvcell{font-variant-numeric:tabular-nums;white-space:nowrap}
.psvcell .p{display:block}
.psvcell .d{font-size:12px;font-weight:600}
.d.bad{color:var(--bad)} .d.warn{color:var(--warn)} .d.ok{color:var(--ok)}
td.cell-bad{background:var(--bad-bg)} td.cell-warn{background:var(--warn-bg)}
.psvin{width:96px;text-align:right}
.cat-h td{background:var(--surface-2);font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:600}

/* dialog */
dialog{border:0;border-radius:14px;padding:0;max-width:min(720px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,12,16,.5)}
.dlg-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font-size:24px;flex:1}
.dlg-b{padding:16px 18px;max-height:70vh;overflow:auto}
.dlg-f{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);align-items:center}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.form label > *{color:var(--ink);font-size:15px}
.form .full{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:1fr}}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0}
legend{font-size:13px;color:var(--muted);padding:0 4px}
.prodpick{display:flex;flex-wrap:wrap;gap:6px}
.prodpick label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px;color:var(--ink);cursor:pointer}
.mkt{background:var(--surface-2);border-radius:10px;padding:12px;margin-top:4px}
.mkt h4{margin:0 0 8px;font-family:"Barlow Condensed",sans-serif;font-size:18px}
.lightbox{max-width:min(1100px,calc(100vw - 24px))}
.lightbox img{display:block;width:100%}
.empty{padding:28px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-size:21px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;z-index:100;font-size:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
[hidden]{display:none!important}
:root{--dd:#24366B;--tbd:#5F6672;--tbd2:#767D89;--key:#7B3FB8;--key-bg:#F1E9FA;--hol:#4E5D78;--hol-bg:#E6EAF1;--own:#0F8A84;--own-bg:#DDF2F0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dd:#6E86C9;--tbd:#7E8694;--tbd2:#949BA8;--key:#B48AE8;--key-bg:#2A2038;--hol:#9AA8C2;--hol-bg:#232A36;--own:#4FC7BF;--own-bg:#163230}}
:root[data-theme="dark"]{--dd:#6E86C9;--tbd:#7E8694;--tbd2:#949BA8;--key:#B48AE8;--key-bg:#2A2038;--hol:#9AA8C2;--hol-bg:#232A36;--own:#4FC7BF;--own-bg:#163230}
.g-cell.k-comercial,.mgrid .day.k-comercial{background:var(--key-bg)}
.g-cell.k-feriado,.mgrid .day.k-feriado{background:var(--hol-bg)}
.g-cell.k-interna,.mgrid .day.k-interna{background:var(--own-bg)}
.g-head .d.kd{box-shadow:inset 0 -3px 0 var(--kc,var(--key))}
.kchip{display:block;width:max-content;min-width:calc(100% - 4px);max-width:none;border:0;border-radius:6px;font-size:12px;font-weight:600;padding:0 7px;line-height:22px;height:22px;margin:4px 2px;color:#fff;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;position:relative;z-index:1}
.kchip.t-comercial{background:var(--key)}.kchip.t-feriado{background:var(--hol)}.kchip.t-interna{background:var(--own)}
.klabel{display:block;width:100%;text-align:left;border:0;background:none;font-size:12px;font-weight:600;padding:0 4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.klabel.t-comercial{color:var(--key)}.klabel.t-feriado{color:var(--hol)}.klabel.t-interna{color:var(--own)}
.g-keyrow .g-label{font-size:13px;color:var(--muted)}
.keystrip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.keystrip .kpill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px 4px 4px;cursor:pointer;font-size:14px}
.keystrip .kpill b{font-family:"Barlow Condensed",sans-serif;font-size:15px;color:#fff;border-radius:5px;padding:1px 7px;min-width:40px;text-align:center}
.kpill.t-comercial b{background:var(--key)}.kpill.t-feriado b{background:var(--hol)}.kpill.t-interna b{background:var(--own)}
.g-flag{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--bad);color:#fff;font-size:12px;font-weight:700;margin-left:4px;flex:none}
.d.above{color:var(--info)} td.cell-above{background:var(--info-bg)}
.alert.above{border-left-color:var(--info)} .alert.above .pct{color:var(--info)}
.nl{opacity:.55} .nl::after{content:" · no listado";font-size:11px}
.acct{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.acard .top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.acard .top img{height:38px;max-width:130px;object-fit:contain;background:var(--logo-bg);border-radius:6px;padding:3px 5px}
.acard .top h3{margin:0;font-size:22px;line-height:1.1}
.acard dl{margin:0;padding:12px 16px;display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:14px;flex:1}
.acard dt{color:var(--muted);font-size:13px}
.acard dd{margin:0;min-width:0;overflow-wrap:anywhere}
.acard .foot{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);flex-wrap:wrap}
.contact{margin-bottom:4px}
.contact a{text-decoration:none}
.rowsedit{display:grid;gap:6px}
.rowsedit .r{display:grid;gap:6px;align-items:center}
.surt{display:flex;flex-wrap:wrap;gap:6px}
.surt span{border-radius:999px;padding:2px 10px;font-size:13px;border:1px solid var(--line)}
.surt .s-ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.surt .s-nv{background:var(--surface-2);color:var(--ink)}
.surt .s-out{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.surt .s-off{color:var(--muted);opacity:.6}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);min-width:120px}
.stack i{display:block;height:100%}
.sel-row td{background:var(--surface-2)}
.sel-row td:first-child{box-shadow:inset 4px 0 0 var(--brand);font-weight:600}
.tip{cursor:help;text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:3px}
.ckrow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:0 0 8px;border-bottom:1px dashed var(--line);margin-bottom:4px}
.ckrow label,.form .ckrow label{display:inline-flex;flex-direction:row;align-items:center;gap:4px;font-size:13px;font-weight:400;color:var(--ink)}
.acard dl{align-content:start}
.cps{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0}
.cps span{font-size:11px;font-weight:600;border-radius:999px;padding:0 7px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.inact{opacity:.6}
h3.sec2{font-size:22px;margin:0 0 10px}
details.panel>summary{list-style:none}details.panel>summary::-webkit-details-marker{display:none}
details.panel:not([open])>summary.panel-h{border-bottom:0}
.agrp{border-top:1px solid var(--line)}
.agrp-h{display:flex;align-items:center;gap:6px 10px;padding:10px 16px;background:var(--surface-2);flex-wrap:wrap}
.agrp-h b{font-family:"Barlow Condensed",sans-serif;font-size:20px}
.tbd{display:inline-block;margin:2px 0;padding:2px 10px;border-radius:6px;border:1px dashed var(--warn);color:var(--warn);font-size:13px;font-weight:600;background:var(--warn-bg)}
.brandline{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:8px;font-size:14px}
.focus{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--hummus);border-radius:12px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap}
.focus b{font-family:"Barlow Condensed",sans-serif;font-size:21px;display:block}
.focus span{font-size:14px;color:var(--muted)} .focus span b{display:inline;font-family:inherit;font-size:inherit;color:var(--ink)}
.focus-logos{display:flex;gap:8px;align-items:center}.focus>div:last-child{flex:1;min-width:260px}.focus-logos img{height:30px;background:var(--logo-bg);border-radius:4px;padding:2px 4px}
details.others{margin-top:8px;border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
details.others summary{cursor:pointer;font-size:13px;color:var(--muted)}
.wl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.wl{padding:14px 16px;border-top:1px solid var(--line)}
.wl-h{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.wl-h b{font-family:"Barlow Condensed",sans-serif;font-size:20px}
.cmp-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:4px 0 6px}
.g-cell.k-precio,.mgrid .day.k-precio,.cc-day.k-precio{background:var(--ok-bg)}
.kchip.t-precio{background:var(--ok)}.klabel.t-precio{color:var(--ok)}.kpill.t-precio b{background:var(--ok)}
.gate{max-width:520px;margin:60px auto;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px}.gate h2{font-family:"Barlow Condensed",sans-serif;font-size:30px;margin:12px 0 6px}
.brandmark .conn a{color:inherit}
.cg-cta{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;background:var(--surface);border:2px solid var(--brand);border-radius:12px;padding:14px 16px}
.cg-cta>div{flex:1;min-width:240px}.cg-cta b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:21px}.cg-cta span{font-size:14px;color:var(--muted)}
.cg-cta .btn.primary{font-size:16px;padding:10px 18px}
.cg-top{display:flex;align-items:flex-end;gap:10px 14px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.cg-top label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.cg-wrap{display:flex;gap:0;max-height:66vh}
.cg-img{width:300px;flex:none;overflow:auto;border-right:1px solid var(--line);background:var(--surface-2)}.cg-img img{width:100%;display:block}
.cg-body{flex:1;max-height:66vh;overflow:auto;padding-top:6px}
.cg-t th{position:sticky;top:0;z-index:1}
.cg-t td{padding:4px 8px;vertical-align:middle}
.cg-t .cg-name{font-weight:500;min-width:190px}
.cg-in{width:110px;padding:6px 8px;font-size:15px}
.cg-mec{width:130px}
.cg-in.autoed::placeholder{color:var(--ok);font-weight:600;opacity:1}
.cg-t tr[data-row]:nth-child(even) td{background:var(--surface-2)}
.cg-t tr[data-row]:has(input[data-f="lista"]:not(:placeholder-shown)) td.cg-name{color:var(--ok)}
.cg-bh td{background:var(--surface)!important;font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:600;padding-top:12px}
.cg-last{white-space:nowrap;font-size:13px;color:var(--muted)}.cg-last span{margin-left:6px}
.cg-copy{border:1px dashed var(--line);background:none;border-radius:6px;padding:2px 6px;cursor:pointer;color:var(--ink);font-size:13px}
.cg-copy:hover{border-color:var(--info);color:var(--info)}
details.cg-sec{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
details.cg-sec summary{cursor:pointer;font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600}
@media (max-width:800px){.cg-wrap{flex-direction:column;max-height:none}.cg-img{width:100%;max-height:220px}.cg-body{max-height:none}}
.bar.mpb{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 5px,transparent 5px 10px)}
.bar.mpb::before{content:"MB";font-size:10px;font-weight:700;background:#fff;color:#333;border-radius:3px;padding:0 3px;margin-right:5px;flex:none}
.tipo-sel{display:flex;flex-direction:column;gap:6px}.tipo-sel label{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important;font-size:15px!important;cursor:pointer}
.guide{background:var(--info-bg);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.guide summary{cursor:pointer;padding:10px 16px;font-weight:600;color:var(--info)}
.guide-b{padding:0 16px 12px;max-width:95ch;font-size:14px}
.guide-b p{margin:0 0 6px}.guide-b ul{margin:0;padding-left:20px}.guide-b li{margin:3px 0}
.banderas{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.btag{display:inline-block;background:var(--ink);color:var(--surface);border-radius:4px;padding:0 7px;font-size:12px;font-weight:600}
.noimg{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px 14px;color:var(--muted);font-size:13px;min-height:140px;cursor:default}
.mpline{font-size:13px;margin:-4px 0 10px;color:var(--muted)}.mpline b{color:var(--ink)}
.btag.mp{background:var(--key)}
.links{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.links a{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;text-decoration:none;color:var(--info)}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--info)}
h4.sec{margin:0 0 8px;font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600}
@media (max-width:700px){main{padding:12px}.top-in{padding:8px 12px 0}.monthnav h2{font-size:26px;min-width:0}}
</style>

const aiKey=()=>{try{return localStorage.getItem("tm-ai-key")||""}catch(e){return""}};
function makeAI(){
  return null; // versión 100% gratuita: carga manual
  const endpoint=(CFG.aiEndpoint||"").trim();if(!endpoint&&!aiKey())return null;
  async function call(prompt,images,maxTokens){
    const imgs=await Promise.all((images||[]).map(async b=>({data:(await blobToData(b)).split(",")[1],media_type:b.type||"image/jpeg"})));
    let r;
    try{
      if(endpoint){const tok=await P.auth.currentUser.getIdToken();
        r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},body:JSON.stringify({prompt,images:imgs,max_tokens:maxTokens,model:CFG.aiModel})});
        if(r.status===429)throw{code:"rate_limited"};if(r.status===401||r.status===403)throw{code:"not_granted"};if(!r.ok)throw{code:"http_"+r.status};
        const j=await r.json();return j.text||""}
      const content=[...imgs.map(i=>({type:"image",source:{type:"base64",media_type:i.media_type,data:i.data}})),{type:"text",text:prompt}];
      r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":aiKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:CFG.aiModel||"claude-sonnet-5-5",max_tokens:maxTokens,messages:[{role:"user",content}]})});
      if(r.status===429||r.status===529)throw{code:"rate_limited"};if(r.status===401||r.status===403)throw{code:"not_granted"};if(!r.ok)throw{code:"http_"+r.status};
      const j=await r.json();return (j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("")
    }catch(e){if(e&&e.code)throw e;throw{code:"network"}}
  }
  const f=async(prompt,opts={})=>{const t=await call(prompt,opts.images,2000);opts.onText?.({text:t});return {text:t}};
  f.json=async(prompt,opts={})=>{const t=await call(prompt+"\n\nRespondé únicamente con el JSON, sin texto antes ni después.",opts.images,8000);
    const m=t.replace(/```json|```/g,"").trim();const a=m.indexOf("{"),b=m.lastIndexOf("}");try{return JSON.parse(m.slice(a,b+1))}catch(e){throw{code:"invalid_json"}}};
  f.limits=async()=>({images:{maxCount:6}});
  return f;
}

  persist(){try{localStorage.setItem("tm-delidips",JSON.stringify(this.mem))}catch(e){}},
  watch(col,cb){
    if(this.local){this.watchers[col]=cb;cb(Object.entries(this.mem[col]||{}).map(([id,d])=>({id,...d})));return}
    P.db.collection(col).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),e=>{console.warn(col,e);if(e.code==="permission-denied")showNoAccess();else toast("No se pudo leer "+col+": "+e.code)});
  },
  async put(col,id,data){
    if(this.local){(this.mem[col]=this.mem[col]||{})[id]=JSON.parse(JSON.stringify(data));this.persist();this.watchers[col]?.(Object.entries(this.mem[col]).map(([i,d])=>({id:i,...d})));return}
    try{await P.db.collection(col).doc(id).set(data)}catch(e){
      toast(e.code==="permission-denied"?"Tu cuenta no tiene permiso para guardar.":"No se pudo guardar ("+e.code+")");throw e}

function promosInMonth(){
  const a=ym()+"-01",b=ym()+"-"+pad(daysIn(S.y,S.m));

/* own items from clipping + manual prices */
function priceObs(){
  const out=[];
  for(const c of S.clips){for(const it of (c.items||[])){if(it.propio&&it.productoId&&(it.precioLista||it.precioFinal))
    out.push({cadena:c.cadena,productoId:it.productoId,fecha:c.fecha,lista:num(it.precioLista),final:num(it.precioFinal)??num(it.precioLista),mecanica:it.mecanica,fuente:"clip",clipId:c.id})}}
  for(const p of S.precios)out.push({cadena:p.cadena,productoId:p.productoId,fecha:p.fecha,lista:num(p.lista),final:num(p.final)??num(p.lista),mecanica:p.mecanica,fuente:"manual",id:p.id});
  return out;
}
const num=v=>{if(v==null||v==="")return null;const n=typeof v==="number"?v:parseFloat(String(v).replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."));return isNaN(n)?null:n};
function latestPrice(cadena,pid,limitDate){
  let best=null;
  for(const o of priceObs()){if(o.cadena!==cadena||o.productoId!==pid)continue;if(limitDate&&o.fecha>limitDate)continue;
    if(!best||o.fecha>best.fecha||(o.fecha===best.fecha&&o.fuente==="manual"))best=o}
  return best;
}
function priceFor(o){if(!o)return null;return S.psvMode==="lista"?(o.lista??o.final):(o.final??o.lista)}
function computeAlerts(){
  const end=ym()+"-"+pad(daysIn(S.y,S.m));const lim=end<TODAY?end:TODAY;
  const res=[];
  for(const p of PROD()){if(!p.psv)continue;for(const c of CADENAS){const o=latestPrice(c.id,p.id,lim);const pr=priceFor(o);if(pr==null)continue;const ps=psvAt(p.id,c.id,o.fecha);if(!ps)continue;
    const dev=(pr-ps)/ps*100;if(Math.abs(dev)>TOL()){const key=c.id+"__"+p.id;const st=S.alertas[key];
      const handled=st&&st.precio===pr;res.push({key,p,c,o,pr,ps,dev,st:handled?st:null})}}}
  return res.sort((a,b)=>Math.abs(b.dev)-Math.abs(a.dev));
}
function clsOf(d){const t=TOL();return d<-2*t?"bad":d<-t?"warn":d>t?"above":"ok"}
const CLS_LABEL={bad:"Muy por debajo",warn:"Por debajo",ok:"En objetivo",above:"Por encima"};
function detectedFor(promo){
  if(promo.tipoMarca==="mp")return S.clips.filter(c=>c.cadena===promo.cadena&&c.fecha>=promo.desde&&c.fecha<=promo.hasta&&(c.items||[]).some(it=>isMp(it,promo.cadena)&&hasPromo(it)&&(promo.cat==="delidips"||promo.cat==="aconfirmar"||it.categoria===promo.cat)&&(!promo.productos?.length||promo.productos.includes(guessPid(it)))));
  return S.clips.filter(c=>c.cadena===promo.cadena&&c.fecha>=promo.desde&&c.fecha<=promo.hasta&&(c.items||[]).some(it=>it.propio&&(promo.cat==="delidips"||promo.cat==="aconfirmar"||it.categoria===promo.cat)&&(it.mecanica||it.descuentoPct)&&(!promo.productos?.length||!it.productoId||promo.productos.includes(it.productoId))));
}
function compItems(){
  const out=[];
  for(const c of S.clips){if(ymOf(c.fecha)!==ym())continue;for(const it of (c.items||[]))if(!it.propio&&!isMp(it,c.cadena))out.push({...it,cadena:c.cadena,fecha:c.fecha,fuente:"clip"})}

  return out;
}

  const dayInfo=[];for(let d=1;d<=N;d++){const dt=new Date(S.y,S.m,d);const w=(dt.getDay()+6)%7;dayInfo.push({d,w,we:w>=5,today:iso(dt)===TODAY,iso:iso(dt)})}
  const keys=keyDatesInMonth();
  const kOn=(ds,cid)=>keys.find(k=>k.desde<=ds&&(k.hasta||k.desde)>=ds&&(!k.cadena||!cid||k.cadena===cid));
  let html=`<div class="gantt-wrap"><div class="gantt"><div class="g-row g-head" style="grid-template-columns:${cols}"><div class="g-label" style="font-size:13px;color:var(--muted)">Cadena</div>${dayInfo.map(x=>{const k=kOn(x.iso);return `<div class="d ${x.today?"today":""} ${k?"kd":""}" ${k?`style="--kc:var(--${k.tipo==="feriado"?"hol":k.tipo==="interna"?"own":k.tipo==="precio"?"ok":"key"})" title="${h(k.nombre)}"`:""}>${WD[x.w]}<b>${x.d}</b></div>`}).join("")}</div>`;
  {const first=ym()+"-01",last=ym()+"-"+pad(N);const lanes=[];const placed=keys.map(k=>{const s=k.desde<first?1:+k.desde.slice(8);const e=(k.hasta||k.desde)>last?N:+(k.hasta||k.desde).slice(8);
      const ve=Math.max(e,s+Math.ceil(((k.nombre.length+(k.cadena?(CAD[k.cadena]?.name.length||0)+3:0))*7+18)/34)-1);
      let li=lanes.findIndex(end=>end<s);if(li<0){li=lanes.length;lanes.push(ve)}else lanes[li]=ve;return {k,s,e,li}});
    if(placed.length)html+=`<div class="g-row g-keyrow" style="grid-template-columns:${cols};grid-template-rows:repeat(${lanes.length},30px)"><div class="g-label" style="grid-row:1/-1">Fechas clave</div>
      ${dayInfo.map((x,i)=>`<div class="g-cell ${x.we?"we":""}" style="grid-column:${i+2};grid-row:1/-1"></div>`).join("")}
      ${placed.map(({k,s,e,li})=>`<button class="kchip t-${k.tipo}" style="grid-column:${s+1}/${e+2};grid-row:${li+1}" data-key="${h(k.id)}" title="${h(k.nombre+(k.cadena?" · "+(CAD[k.cadena]?.name||""):"")+(k.nota?" · "+k.nota:""))}">${h(k.nombre)}${k.cadena?" · "+h(CAD[k.cadena]?.name||""):""}</button>`).join("")}</div>`}
  const cads=S.calCadena?[CAD[S.calCadena]]:CADENAS;
  const first=ym()+"-01",last=ym()+"-"+pad(N);
  for(const c of cads){
    const ps=list.filter(p=>p.cadena===c.id).sort((a,b)=>a.desde.localeCompare(b.desde));
    const lanes=[];const placed=ps.map(p=>{const s=p.desde<first?1:+p.desde.slice(8);const e=p.hasta>last?N:+p.hasta.slice(8);
      let li=lanes.findIndex(end=>end<s);if(li<0){li=lanes.length;lanes.push(e)}else lanes[li]=e;return {p,s,e,li}});
    const L=Math.max(1,lanes.length);
    html+=`<div class="g-row" style="grid-template-columns:${cols};grid-template-rows:repeat(${L},32px)">
      <div class="g-label" style="grid-row:1/-1" title="${h(c.name)}"><img src="${c.logo}" alt="${h(c.name)}">${(()=>{const miss=commitsOf(c.id).filter(x=>x.st!=="ok");return miss.length?`<span class="g-flag" title="${h(miss.map(x=>"Acuerdo: "+x.need+" promo(s) de "+catName(x.c.cat)+" "+FRECS[x.c.frecuencia][0]+" · cargadas "+x.done).join("\n"))}">!</span>`:""})()}</div>
      ${dayInfo.map((x,i)=>{const k=kOn(x.iso,c.id);return `<div class="g-cell ${x.we?"we":""} ${x.today?"today":""} ${k?"k-"+k.tipo:""}" style="grid-column:${i+2};grid-row:1/-1" data-newday="${x.iso}" title="${k?h(k.nombre)+" · ":""}Doble clic para crear promo el ${x.d}"></div>`}).join("")}
      ${placed.map(({p,s,e,li})=>{const l=promoLabel(p);return `<button class="${barClass(p)}" style="grid-column:${s+1}/${e+2};grid-row:${li+1}" data-promo="${p.id}" title="${h(promoBrand(p)+" · "+l.m+" · "+l.prods+" · "+fdate(p.desde)+"–"+fdate(p.hasta))}"><span class="st">${stIcon(p)}</span>${h(promoBrand(p))} · ${h(l.m)} <span style="opacity:.8">· ${h(l.prods)}</span></button>`}).join("")}
    </div>`;
  }
  html+=`</div></div>`;
  if(!list.length)html+=`<div class="empty"><strong>Sin promos este mes</strong>Cargá la primera con “Nueva promo” o hacé doble clic en un día.</div>`;
  return html;
}
function monthHTML(list){
  const DN=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const first=new Date(S.y,S.m,1);const gs=addD(first,-first.getDay());
  const keys=keyDatesInMonth();
  let html=`<div class="cc-wrap"><div class="cc"><div class="cc-title">${MESES[S.m]} ${S.y}</div><div class="cc-head">${DN.map(d=>`<div>${d}</div>`).join("")}</div>`;
  for(let w=0;w<6;w++){
    const ws=addD(gs,w*7);if(w>0&&ws.getMonth()!==S.m)break;
    const days=[...Array(7)].map((_,i)=>{const d=addD(ws,i);return {d,ds:iso(d),out:d.getMonth()!==S.m}});
    const a=days[0].ds,b=days[6].ds;
    const ps=list.filter(p=>p.desde<=b&&p.hasta>=a).sort((x,y)=>x.desde.localeCompare(y.desde)||y.hasta.localeCompare(x.hasta));
    const lanes=[];const placed=ps.map(p=>{const s=p.desde<a?0:days.findIndex(x=>x.ds===p.desde);const e=p.hasta>b?6:days.findIndex(x=>x.ds===p.hasta);
      let li=lanes.findIndex(end=>end<s);if(li<0){li=lanes.length;lanes.push(e)}else lanes[li]=e;return {p,s,e,li,cl:p.desde<a,cr:p.hasta>b}});
    const L=lanes.length;
    html+=`<div class="cc-wk" style="grid-template-rows:auto repeat(${L},26px) minmax(14px,1fr)">`;
    days.forEach((x,i)=>{const kk=keys.filter(k=>k.desde<=x.ds&&(k.hasta||k.desde)>=x.ds);const we=i===0||i===6;
      html+=`<div class="cc-day ${x.out?"out":""} ${we?"we":""} ${!x.out&&kk[0]&&!kk[0].cadena?"k-"+kk[0].tipo:""}" style="grid-column:${i+1};grid-row:1/-1" ${x.out?"":`data-newday="${x.ds}" title="Doble clic para crear promo"`}></div>
        <div class="cc-top" style="grid-column:${i+1};grid-row:1"><span class="cc-n ${x.ds===TODAY?"today":""}">${x.d.getDate()}</span>${x.out?"":kk.map(k=>`<button class="klabel t-${k.tipo}" data-key="${h(k.id)}" title="${h(TIPOS_K[k.tipo]+(k.nota?" · "+k.nota:""))}">★ ${h(k.nombre)}${k.cadena?" · "+h(CAD[k.cadena]?.name||""):""}</button>`).join("")}</div>`});
    html+=placed.map(({p,s,e,li,cl,cr})=>{const l=promoLabel(p);const c=CAD[p.cadena];
      return `<button class="${barClass(p)} cc-bar ${cl?"cl":""} ${cr?"cr":""}" style="grid-column:${s+1}/${e+2};grid-row:${li+2}" data-promo="${p.id}" title="${h((c?.name||"")+" · "+promoBrand(p)+" · "+l.m+" · "+l.prods+" · "+fdate(p.desde)+"–"+fdate(p.hasta))}"><img src="${c?.logo||""}" alt=""><span class="st">${stIcon(p)}</span>${h(promoBrand(p))} · ${h(l.m)} <span style="opacity:.8">· ${h(l.prods)}</span></button>`}).join("");
    html+=`</div>`;
  }
  return html+`</div></div>`;
}
function listHTML(list){
  if(!list.length)return `<div class="empty"><strong>Sin promos para este filtro</strong>Probá otra cadena o mes.</div>`;
  return `<div class="tbl-wrap"><table class="t"><thead><tr><th>Vigencia</th><th>Cadena</th><th>Categoría</th><th>Mecánica</th><th>Productos</th><th>Estado comercial</th><th>Seguimiento</th><th>Clipping</th></tr></thead><tbody>
  ${list.sort((a,b)=>a.desde.localeCompare(b.desde)).map(p=>{const l=promoLabel(p);const det=detectedFor(p).length;const [cn,cc]=CUMPL[p.cumpl||"pend"];
    return `<tr class="click" data-promo="${p.id}"><td style="white-space:nowrap">${fdate(p.desde)} – ${fdate(p.hasta)}</td>
    <td><img class="minilogo" src="${CAD[p.cadena]?.logo}" alt=""> ${h(CAD[p.cadena]?.name)}</td>
    <td><span class="catdot" style="background:${PCATS[p.cat].color}"></span>${PCATS[p.cat].name}</td>
    <td><b>${h(l.m)}</b></td><td>${h(l.prods)}</td>
    <td><span class="tag ${p.estado==="conf"?"ok":p.estado==="cancel"?"bad":p.estado==="plan"?"warn":"info"}">${ESTADOS[p.estado]||"—"}</span></td>
    <td><span class="tag ${cc}">${cn}</span></td>
    <td>${det?`<span class="tag ok">Vista en ${det} captura${det>1?"s":""}</span>`:(p.desde<=TODAY?`<span class="tag neutral">Sin capturas</span>`:`<span class="muted small">Aún no empieza</span>`)}</td></tr>`}).join("")}
  </tbody></table></div>`;
}
function openPromo(p,day,prefill){
  const isNew=!p;

  p=p?JSON.parse(JSON.stringify(p)):prefill?prefill:{id:uid(),cadena:S.calCadena||"dia",cat:"hummus",productos:[],mecanica:"% de descuento",descuento:"",precio:"",desde:d,hasta:d,estado:"plan",notasCom:"",cumpl:"pend",obsMkt:""};
  const dlg=$("#dlg");
  const prodPick=()=>{const ps=PROD().filter(x=>p.cat==="delidips"||p.cat==="aconfirmar"||x.cat===p.cat);const sur=surtidoOf(p.cadena);return (ps.length?ps.map(x=>`<label><input type="checkbox" value="${x.id}" ${p.productos?.includes(x.id)?"checked":""}>${h(p.tipoMarca==="mp"?mbName(x,p.cadena):x.nombre)}</label>`).join(""):`<span class="muted small">Sin productos cargados para esta categoría.</span>`)+(p.tipoMarca==="mp"?"":`<div class="small muted" style="flex-basis:100%;margin-top:4px">${h(acuerdoNote(p.cadena,p.cat))}</div>`)};
  const det=isNew?[]:detectedFor(p);
  dlg.innerHTML=`<form method="dialog" id="pf">
    <div class="dlg-h"><h3>${isNew?"Nueva promoción":"Editar promoción"}</h3><button class="iconbtn" value="x" formnovalidate aria-label="Cerrar">×</button></div>
    <div class="dlg-b"><div class="form">
      <label>Cadena<select name="cadena">${CADENAS.map(c=>`<option value="${c.id}" ${p.cadena===c.id?"selected":""}>${c.name}</option>`).join("")}</select></label>
      <fieldset class="full"><legend>¿De qué marca es la promo?</legend><div class="tipo-sel">
        <label><input type="radio" name="tipoMarca" value="" ${p.tipoMarca!=="mp"?"checked":""}> <b>Nuestras marcas</b> <span class="muted small">Kyros · Salsas Kansas · Kansas Bakery</span></label>
        <label><input type="radio" name="tipoMarca" value="mp" ${p.tipoMarca==="mp"?"checked":""}> <b>Marca blanca</b> <span class="muted small" id="mbHint">Hummus · Salsas · Panes que fabricamos para la cadena</span></label></div></fieldset>
      <label>Categoría<select name="cat"></select></label>
      <fieldset class="full"><legend>Productos (sin marcar = toda la línea)</legend><div class="prodpick" id="pp">${prodPick()}</div></fieldset>
      <label>Mecánica<select name="mecanica">${MECANICAS.map(m=>`<option ${p.mecanica===m?"selected":""}>${m}</option>`).join("")}</select></label>
      <label>Descuento %<input type="number" name="descuento" min="0" max="100" step="0.5" value="${h(p.descuento)}" placeholder="ej. 25"></label>
      <label>Desde<input type="date" name="desde" value="${p.desde}" required></label>
      <label>Hasta<input type="date" name="hasta" value="${p.hasta}" required></label>
      <label>Precio promo (opcional)<input type="number" name="precio" min="0" value="${h(p.precio)}" placeholder="$"></label>
      <label>Estado comercial<select name="estado">${Object.entries(ESTADOS).map(([k,n])=>`<option value="${k}" ${p.estado===k?"selected":""}>${n}</option>`).join("")}</select></label>
      <label class="full">Notas de comercial<textarea name="notasCom" rows="2" placeholder="Condiciones, quién paga el descuento, contacto en la cadena…">${h(p.notasCom)}</textarea></label>
      <div class="mkt full"><h4>Seguimiento de marketing</h4><div class="form">
        <label>Cumplimiento<select name="cumpl">${Object.entries(CUMPL).map(([k,[n]])=>`<option value="${k}" ${p.cumpl===k?"selected":""}>${n}</option>`).join("")}</select></label>
        <div class="small muted" style="align-self:end">${isNew?"":det.length?`Detectada en ${det.length} captura${det.length>1?"s":""} de clipping (${det.map(c=>fdate(c.fecha)).slice(0,6).join(", ")}).`:"Todavía no aparece en ninguna captura de clipping dentro de la vigencia."}</div>
        <label class="full">Observaciones<textarea name="obsMkt" rows="2" placeholder="Cómo se vio en la cadena, si el descuento coincide, exhibición…">${h(p.obsMkt)}</textarea></label>
      </div></div>
    </div>${!isNew&&p.by?`<p class="small muted" style="margin:12px 0 0">Cargada <span data-uid="${h(p.by)}"></span>${p.updAt?" · última edición "+new Date(p.updAt).toLocaleDateString("es-AR"):""}</p>`:""}</div>
    <div class="dlg-f">${isNew?"":`<button type="button" class="btn ghost" id="pDel" style="color:var(--bad)">Eliminar</button><button type="button" class="btn ghost" id="pDup">Duplicar</button>`}<div class="spacer"></div><button class="btn" value="x" formnovalidate>Cancelar</button><button class="btn primary" value="ok" id="pSave">Guardar promo</button></div>
  </form>`;
  const f=dlg.querySelector("#pf");
  f.cat.onchange=()=>{p.cat=f.cat.value;p.productos=[];dlg.querySelector("#pp").innerHTML=prodPick()};
  const fillCats=()=>{const mb=p.tipoMarca==="mp";const opts=mb?Object.entries(MB_CATS).map(([k,n])=>[k,n]):Object.entries(PCATS).map(([k,c])=>[k,k==="delidips"?"DeliDips · todas las marcas / combos":k==="aconfirmar"?"❓ A confirmar · en negociación, se define después":c.name+" · "+c.marca]);
    if(!opts.some(o=>o[0]===p.cat))p.cat=opts[0][0];f.cat.innerHTML=opts.map(([k,n])=>`<option value="${k}" ${p.cat===k?"selected":""}>${n}</option>`).join("")};

  f.onsubmit=async e=>{
    if(e.submitter?.value!=="ok")return;
    const fd=new FormData(f);
    const o={...p};for(const k of ["cadena","tipoMarca","cat","mecanica","descuento","precio","desde","hasta","estado","notasCom","cumpl","obsMkt"])o[k]=fd.get(k)||"";
    o.productos=[...dlg.querySelectorAll("#pp input:checked")].map(i=>i.value);
    if(o.hasta<o.desde)o.hasta=o.desde;
    o.descuento=o.descuento===""?"":+o.descuento;o.precio=o.precio===""?"":+o.precio;
    if(!o.by)o.by=P.me||"";o.updAt=Date.now();
    const {id,...data}=o;await Store.put("promos",id,data);toast(isNew?"Promo guardada":"Cambios guardados");
  };
  dlg.querySelector("#pDel")?.addEventListener("click",async()=>{if(await askConfirm("¿Eliminar esta promoción?")){dlg.close();await Store.del("promos",p.id);toast("Promo eliminada")}});
  dlg.querySelector("#pDup")?.addEventListener("click",()=>{dlg.close();const c={...p,id:uid(),cumpl:"pend",obsMkt:"",by:P.me||"",estado:"plan",updAt:0};setTimeout(()=>openPromo(null,null,c),0)});
  dlg.showModal();
}

/* ---------- CLIPPING ---------- */
function renderClip(v,tb){
  tb.innerHTML="";
  const mc=S.clips.filter(c=>ymOf(c.fecha)===ym()&&clipRelevant(c));
  const chains=CADENAS.map(c=>{const n=mc.filter(x=>x.cadena===c.id).length;const today=S.clips.some(x=>x.cadena===c.id&&x.fecha===TODAY&&clipRelevant(x));
    return `<button class="chainbtn" data-cad="${c.id}" aria-pressed="${S.clipCadena===c.id}">${today?`<span class="dot" title="Ya tiene captura hoy"></span>`:""}<img src="${c.logo}" alt=""><span>${h(c.name)} · ${n} relevamiento${n===1?"":"s"}</span></button>`}).join("");
  const cad=CAD[S.clipCadena];
  const bands=BANDERAS[cad.id]||null;if(!bands||!bands.includes(S.clipBandera))S.clipBandera=bands?S.clipBandera&&bands.includes(S.clipBandera)?S.clipBandera:"":"";
  const caps=mc.filter(c=>c.cadena===cad.id&&(!S.clipBandera||c.bandera===S.clipBandera));
  const links=(cuentaOf(cad.id).links||[]).filter(l=>/^https?:\/\//.test(l.url||""));
  const N=daysIn(S.y,S.m);
  let strip=`<div class="daystrip"><button aria-pressed="${!S.clipDay}" data-day="" style="grid-column:span 2"><b>Todo</b>el mes</button>`;
  for(let d=1;d<=N;d++){const ds=ym()+"-"+pad(d);const n=caps.filter(c=>c.fecha===ds).length;const w=(new Date(S.y,S.m,d).getDay()+6)%7;
    strip+=`<button data-day="${ds}" aria-pressed="${S.clipDay===ds}" class="${n?"has":""} ${ds>TODAY?"future":""}">${WD[w]}<b>${d}</b>${n?`<i>${n}</i>`:""}</button>`}
  strip+=`</div>`;
  const shown=(S.clipDay?caps.filter(c=>c.fecha===S.clipDay):caps).sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.createdAt||0)-(a.createdAt||0));
  const defDate=S.clipDay||(ym()===TODAY.slice(0,7)?TODAY:ym()+"-01");

  // side: planned vs detected
  const planned=promosInMonth().filter(p=>p.cadena===cad.id&&p.estado!=="cancel");
  const own=new Map();for(const c of caps)for(const it of (c.items||[]))if(it.propio&&(it.mecanica||it.descuentoPct)){const k=(it.productoId||it.producto)+"|"+(it.mecanica||it.descuentoPct+"%");const e=own.get(k);if(e){e.first=e.first<c.fecha?e.first:c.fecha;e.last=e.last>c.fecha?e.last:c.fecha;e.n++}else own.set(k,{it,first:c.fecha,last:c.fecha,n:1})}

  const mode=S.clipCfg?.img||"mini";const u=S.assetUsage;
  v.innerHTML=`<div class="focus"><div class="focus-logos"><img src="${LOGOS.kyros}" alt="Kyros"><img src="${LOGOS.salsas}" alt="Salsas Kansas"><img src="${LOGOS.bakery}" alt="Kansas Bakery"></div><div><b>Clipping de nuestras marcas</b><span>Acá se analizan <b>Kyros</b> y <b>Kansas</b> (Salsas Kansas y Kansas Bakery): precios, promos y cumplimiento del calendario en cada cadena. Lo que cargues de marcas blancas y competencia se analiza en <a href="#" data-gocomp>Competencia</a>.</span></div></div>
  <div class="chains" role="group" aria-label="Cadena">${chains}</div>
  ${bands?`<div class="banderas"><span class="small muted" style="font-weight:600">Bandera de ${h(cad.name)}</span><div class="seg" role="group" aria-label="Bandera"><button data-band="" aria-pressed="${!S.clipBandera}">Todas</button>${bands.map(b=>`<button data-band="${b}" aria-pressed="${S.clipBandera===b}">${b} · ${mc.filter(c=>c.cadena===cad.id&&c.bandera===b).length}</button>`).join("")}</div></div>`:""}
  <div class="cliplayout"><div>
    <div class="panel" style="margin-bottom:14px"><div class="panel-b">${strip}</div></div>
    ${mpOf(cad.id)?`<p class="mpline">Marca blanca que le fabricamos a ${h(cad.name)}: <b>${h(mpOf(cad.id))}</b> · sus productos se separan solos y se analizan en la solapa Competencia.</p>`:""}
    <div class="links"><span class="small muted" style="font-weight:600"><span class="tip" title="Opcional. Son accesos directos a las secciones de la web de la cadena donde están nuestros productos, para abrirlas rápido y sacar las capturas. No cargan datos solos: la información se sigue tomando de las imágenes que subís.">Páginas para relevar (opcional):</span></span>${links.map(l=>`<a href="${h(l.url)}" target="_blank" rel="noopener">${h(l.label||l.url.replace(/^https?:\/\/(www\.)?/,"").slice(0,40))} ↗</a>`).join("")||`<span class="small muted">ninguno cargado</span>`}<button class="btn small ghost" id="edLinks">${links.length?"Editar accesos":"+ Agregar acceso"}</button></div>
    <div class="cg-cta"><div><b>Relevamiento de ${h(cad.name)}</b><span>Cargá a mano los precios y promos de Kyros y Kansas que ves en la web o la góndola. Solo completás lo que ves.</span></div>
      <label class="small muted">Fecha <input type="date" id="capDate" value="${defDate}"></label>
      <button class="btn" id="xlOpen">📊 Importar Excel</button><button class="btn primary" id="cgOpen">⚡ Cargar relevamiento</button></div>
    <div style="margin-top:14px" id="caps">${shown.length?shown.map(captureHTML).join(""):`<div class="empty"><strong>Sin capturas ${S.clipDay?"este día":"este mes"}</strong>Tocá “⚡ Cargar relevamiento” para cargar los precios y promos de ${h(cad.name)}.</div>`}</div>
  </div>
  <aside class="side">
    <div class="panel" style="margin-bottom:14px"><div class="panel-b"><h4>Planificado vs. visto en ${h(cad.name)}</h4>

async function analyzeClip(c,img){
  if(!P.sample||!P.imgOK)return;
  S.analyzing.add(c.id);render();
  try{
    if(!img){img=await new Promise((res,rej)=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>res(i);i.onerror=rej;i.src=imgSrc(c)})}
    const blobs=await tiles(img);
    const cat=PROD().map(p=>`${p.id} = ${PCATS[p.cat].marca} ${p.nombre}`).join("\n");
    const prompt=`Sos analista de trade marketing de DeliDips (Argentina). Nuestras marcas: Kyros (hummus y babaganush), Salsas Kansas / Kansas Deli (salsas y aderezos), Kansas Bakery / Kansas Deli (panificados).
Te paso ${blobs.length>1?blobs.length+" recortes consecutivos (de arriba hacia abajo, con algo de solapamiento) de UNA captura":"una captura"} de la web o app de la cadena "${CAD[c.cadena].name}${c.bandera?" ("+c.bandera+")":""}", tomada el ${c.fecha}.

Extraé cada producto visible de estas categorías: hummus / dips / untables, salsas / aderezos / ketchup / mayonesas, panificados (panes, wraps, tostadas, etc.). Incluí nuestras marcas Y las de la competencia. Ignorá productos de otras categorías. No repitas un producto que aparece en el solapamiento entre recortes.

Catálogo propio (si el producto es nuestro, poné su id en productoId; si es nuestro pero no está en la lista, productoId null):
${cat}
${mpOf(c.cadena)?`
IMPORTANTE: DeliDips fabrica la marca blanca de esta cadena, "${mpOf(c.cadena)}". Los productos de esa marca NO son competencia: marcalos con "marcaPropiaCadena": true y "propio": false, y en productoId poné el id del producto equivalente de nuestro catálogo (ej. un hummus de pimentón ${mpOf(c.cadena)} → el id del Hummus Pimentón; una salsa de ajo o alioli → Aioli). Si no hay equivalente claro, productoId null.
`:""}

Para cada producto:
- precioLista: el precio tachado o de lista; si no hay promo, el precio visible.
- precioFinal: el precio que paga el cliente con la promo; si no hay promo, igual a precioLista.
- descuentoPct: el % de descuento si se muestra o se puede calcular; si no, null.
- mecanica: texto corto de la promo tal como se ve ("5% OFF", "2x1", "2da al 70%", "Precio especial") o null si no tiene promo.
Precios como número en pesos, sin separador de miles (ej. "$4.975,50" → 4975.5). Si un dato no se ve, null. No inventes nada.

Respondé solo con JSON, con esta forma:
{"resumen":"1 o 2 frases sobre lo que muestra la captura y las promos más relevantes","items":[{"producto":"nombre corto","marca":"marca","categoria":"hummus|salsas|panificados","propio":true,"marcaPropiaCadena":false,"productoId":"id o null","presentacion":"ej. 230g o null","precioLista":null,"precioFinal":null,"descuentoPct":null,"mecanica":null,"vigencia":"si se indica, si no null"}]}`;
    const r=await P.sample.json(prompt,{images:blobs,modelTier:"default"});
    const mpN=normTxt(mpOf(c.cadena));
    const items=(Array.isArray(r?.items)?r.items:[]).map(it=>{const isMp=!!mpN&&(!!it.marcaPropiaCadena||(!it.propio&&normTxt(it.marca)&&(normTxt(it.marca)===mpN||normTxt(it.marca).includes(mpN)||mpN.includes(normTxt(it.marca)))));return {producto:String(it.producto||""),marca:String(it.marca||""),categoria:["hummus","salsas","panificados"].includes(it.categoria)?it.categoria:"otra",
      mp:isMp,propio:!isMp&&!!it.propio,productoId:it.productoId&&prodById(it.productoId)?it.productoId:null,presentacion:it.presentacion||"",precioLista:num(it.precioLista),precioFinal:num(it.precioFinal),descuentoPct:num(it.descuentoPct),mecanica:it.mecanica||"",vigencia:it.vigencia||""}});
    const cur=S.clips.find(x=>x.id===c.id)||c;const {id,...rest}=cur;
    await Store.put("clips",c.id,{...rest,items,resumen:String(r?.resumen||""),estado:"listo",error:""});
  }catch(e){
    const msg=e?.code==="not_granted"?"La lectura de imágenes no está activada o la clave no es válida (⚙ Configuración).":e?.code==="rate_limited"?"Demasiadas lecturas seguidas; probá de nuevo en un minuto.":e?.code==="invalid_json"?"No se pudo interpretar la respuesta; probá “Volver a leer”.":"No se pudo leer la imagen ("+(e?.code||"error")+").";
    const cur=S.clips.find(x=>x.id===c.id)||c;const {id,...rest}=cur;await Store.put("clips",c.id,{...rest,estado:"error",error:msg}).catch(()=>{});
    if(e?.code==="not_granted")P.imgOK=false;
  }finally{S.analyzing.delete(c.id);render()}
}

/* ---------- shared helpers ---------- */
const catName=k=>k==="todas"?"cualquier categoría":(PCATS[k]?.name.replace(/^(?!DeliDips)./,c=>c.toLowerCase())||k);
const FRECS={mensual:["por mes",1],bimestral:["por bimestre",2],trimestral:["por trimestre",3],semestral:["por semestre",6],anual:["por año",12]};
const acuerdoOf=cid=>S.acuerdos.find(a=>a.id===cid)||null;
function surtidoOf(cid){const a=acuerdoOf(cid);return a?.surtido?.length?a.surtido:null}
function periodOf(frec,y,m){const n=FRECS[frec]?.[1]||1;const s=Math.floor(m/n)*n;const e=s+n-1;
  return {a:`${y}-${pad(s+1)}-01`,b:`${y}-${pad(e+1)}-${pad(daysIn(y,e))}`,label:n===1?MESES[m]:`${MESES[s].slice(0,3)}–${MESES[e].slice(0,3)}`}}
function commitsOf(cid){const a=acuerdoOf(cid);if(!a?.compromisos?.length)return [];
  return a.compromisos.filter(c=>c.cat&&FRECS[c.frecuencia]).map(c=>{const per=periodOf(c.frecuencia,S.y,S.m);
    const ps=S.promos.filter(p=>p.cadena===cid&&p.estado!=="cancel"&&p.tipoMarca!=="mp"&&(c.cat==="todas"||p.cat===c.cat||p.cat==="delidips")&&p.desde<=per.b&&p.hasta>=per.a);
    const need=Math.max(1,+c.cantidad||1),done=ps.length;const st=done>=need?"ok":per.b<TODAY?"bad":"warn";
    return {c,per,ps,need,done,conf:ps.filter(p=>p.estado==="conf").length,st}})}
function acuerdoNote(cid,cat){const a=acuerdoOf(cid);if(!a)return `Sin acuerdo cargado para ${CAD[cid]?.name||""}.`;
  const parts=[];const sur=surtidoOf(cid);
  if(sur){const inCat=PROD().filter(p=>(cat==="delidips"||cat==="aconfirmar"||p.cat===cat)&&sur.includes(p.id));parts.push(inCat.length?`Surtido acordado: ${inCat.map(p=>p.nombre).join(", ")}.`:`Sin surtido de ${catName(cat)} acordado en esta cadena.`)}
  const cm=commitsOf(cid).filter(x=>x.c.cat===cat||x.c.cat==="todas"||cat==="delidips");
  for(const x of cm)parts.push(`Acuerdo: ${x.need} promo${x.need>1?"s":""} ${FRECS[x.c.frecuencia][0]} (${x.per.label}: ${x.done} cargada${x.done===1?"":"s"}).`);
  return parts.join(" ")||"Acuerdo sin surtido ni compromisos para esta categoría."}
function seenIds(cid){const set=new Set();for(const x of S.precios)if(x.cadena===cid&&ymOf(x.fecha||"")===ym())set.add(x.productoId);for(const c of S.clips){if(c.cadena!==cid||ymOf(c.fecha)!==ym())continue;for(const it of (c.items||[]))if(it.propio&&it.productoId)set.add(it.productoId)}return set}

const TIPOS_F={comercial:"Fecha comercial",feriado:"Feriado",interna:"Evento propio / lanzamiento"};
const TIPOS_K={...TIPOS_F,precio:"Cambio de precio sugerido"};
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),hh=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-hh-k)%7,m=Math.floor((a+11*hh+22*l)/451);
  const mo=Math.floor((hh+l-7*m+114)/31),da=((hh+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const nthSunday=(y,m,n)=>{const d=new Date(y,m,1);return new Date(y,m,1+(7-d.getDay())%7+7*(n-1))};
function builtinFechas(y){
  const E=easter(y),L=[];
  const add=(d,nombre,tipo,hasta)=>{const ds=typeof d==="string"?y+"-"+d:iso(d);const hs=hasta?(typeof hasta==="string"?y+"-"+hasta:iso(hasta)):"";
    L.push({id:"b-"+y+"-"+nombre.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-"),desde:ds,hasta:hs,nombre,tipo,builtin:true})};
  add("01-01","Año Nuevo","feriado");
  add(addD(E,-48),"Carnaval","feriado",addD(E,-47));
  add("02-14","San Valentín","comercial");
  add("03-24","Día de la Memoria","feriado");
  add("04-02","Día de Malvinas","feriado");
  add(addD(E,-3),"Semana Santa","feriado",addD(E,-2));
  add(E,"Pascuas","comercial");
  add("05-01","Día del Trabajador","feriado");
  add("05-25","Revolución de Mayo","feriado");
  add(nthSunday(y,5,3),"Día del Padre","comercial");
  add("06-20","Día de la Bandera","feriado");
  add("07-09","Día de la Independencia","feriado");
  add("07-20","Día del Amigo","comercial");
  add(nthSunday(y,7,3),"Día del Niño","comercial");
  add("09-21","Día de la Primavera","comercial");
  add(nthSunday(y,9,3),"Día de la Madre","comercial");
  {const n1=new Date(y,10,1);const th=1+((4-n1.getDay()+7)%7)+21;add(new Date(y,10,th+1),"Black Friday","comercial")}
  add("12-08","Inmaculada Concepción","feriado");
  add("12-24","Nochebuena","comercial");
  add("12-25","Navidad","feriado");
  add("12-31","Fin de año","comercial");
  return L;
}
function keyDatesInMonth(){
  const a=ym()+"-01",b=ym()+"-"+pad(daysIn(S.y,S.m));const hid=new Set(S.fechasCfg?.ocultas||[]);
  const all=[...builtinFechas(S.y).filter(k=>!hid.has(k.id)),...S.fechas.map(f=>({...f,tipo:TIPOS_F[f.tipo]?f.tipo:"comercial"}))];

/* ---------- guías de lectura ---------- */
const GUIDES={
cuentas:{t:"Cómo leer Cuentas",b:`<p>Es la base de datos de cada comprador (cadena). La completa y actualiza el equipo comercial: tocá <b>Completar</b> o <b>Editar</b> en cada tarjeta.</p>
<ul><li><b>Razón social / CUIT:</b> datos fiscales de la cuenta.</li><li><b>Comercial DeliDips:</b> quién de nuestro equipo lleva la cuenta.</li><li><b>Contactos en la cadena:</b> compradores, category managers o trade de la cadena, con mail y teléfono (se pueden tocar para escribir o llamar).</li>
<li><b>Pie de la tarjeta:</b> bocas donde estamos y cantidad de productos (SKUs) acordados, tomados de la solapa Dinámicas, y cuántas promos tiene la cadena en el mes que se está mirando.</li><li><b>Compra:</b> las categorías que maneja cada contacto (hummus, salsas secas, salsas frías, pan), para saber a quién llamar según el producto.</li>
<li><b>⚠ en un mail:</b> la dirección parece mal escrita (dominio o caracteres raros); conviene revisarla.</li>
<li><b>+ Nueva cuenta</b> agrega un comprador que no está en la lista; aparece automáticamente en todas las solapas.</li>
<li><b>Directorio de clientes:</b> el resto de los clientes (mayoristas, regionales, distribuidores, directos) con sus contactos. Se filtra por canal o por categoría que compra. “Pasar a seguimiento” lo suma a las cadenas de arriba y a todas las solapas.</li></ul>`},
acuerdos:{t:"Cómo leer Dinámicas",b:`<p>Es la ficha comercial de cada cadena: qué tenemos ahí, qué le fabricamos y qué pactamos. La tabla de arriba resume todas las cadenas; tocá una fila (o elegila en el selector) para ver el detalle abajo, y “Editar acuerdo” para cargarlo o corregirlo.</p>
<ul><li><b>Bocas:</b> sucursales donde estamos. Si se carga el total de la cadena, se ve “30 / 120 (25%)” = porcentaje de cobertura.</li>
<li><b>Nuestras marcas (variedades):</b> informativo. Qué variedades de Kyros, Salsas Kansas y Kansas Bakery tenemos listadas en esa cadena (ej. en Dia: Kyros Clásico, Pimentón y Oliva).</li>
<li><b>Marca blanca que le fabricamos:</b> la marca de la cadena que producimos nosotros (Cuisine & Co, Carrefour Classic, Dia), qué productos le fabricamos y las promos o acuerdos propios de esa marca, todo separado de nuestras marcas. También se compara su precio con el de nuestra marca.</li>
<li><b>A completar:</b> el dato todavía no está cargado; lo completa comercial.</li>
<li><b>Compromisos de promo:</b> “0/1 salsas por mes” = promos cargadas en el calendario / promos pautadas en el período. Verde: cumplido. Amarillo: falta, pero el período sigue abierto. Rojo: el período terminó y no se cumplió. Las promos “DeliDips” cuentan para cualquier categoría; las “A confirmar” y las rechazadas no cuentan.</li>
<li><b>Cobertura y clusters, contraprestaciones y notas:</b> detalle de formatos o zonas, rappel, fee de listing, exhibiciones y cualquier otro dato del acuerdo.</li>
<li><b>Vigencia:</b> fechas del acuerdo; “Vencido” si ya pasó la fecha de fin.</li></ul>`},

cal:{t:"Cómo leer el Calendario de promociones",b:`<p>Comercial carga las promos que se vienen; marketing hace el seguimiento de cada una (cumplida, parcial o no cumplida).</p>
<ul><li><b>Promos en el mes:</b> cantidad de promos vigentes en algún día del mes (sin contar las rechazadas).</li>
<li><b>Aprobadas por la cadena:</b> de esas, cuántas ya están cerradas con el comprador. El resto está como propuesta (de su lado o del nuestro) o en negociación.</li>
<li><b>Cadenas con promo:</b> cuántas cadenas tienen al menos una promo, sobre el total.</li>
<li><b>Descuento promedio:</b> promedio simple de los % de descuento cargados (no incluye 2x1 o precios especiales sin %).</li>
<li><b>Cumplidas:</b> de las promos que ya terminaron, qué porcentaje marketing marcó como cumplidas.</li>
<li><b>Colores de barra:</b> naranja Kyros, rojo Salsas Kansas, dorado Kansas Bakery. Barra punteada = sin aprobar (propuesta o en negociación). Tachada = rechazada. ✓ cumplida, ◐ parcial, ✕ no cumplida.</li>
<li><b>Marca blanca (MB):</b> también se pueden cargar las promos de las marcas blancas que fabricamos (ej. 25% OFF en el hummus clásico marca blanca de Dia). Al cargar la promo, en “¿De qué marca es la promo?” se elige “Marca blanca” y después Hummus, Salsas o Panes y sus variedades. Se ven rayadas y con la etiqueta MB, no cuentan en los totales de arriba ni en los compromisos, y se pueden ocultar con el filtro “Marca blanca”.</li><li><b>Fechas clave:</b> días pintados de violeta (fecha comercial), gris azulado (feriado) o verde agua (evento propio).</li>
<li><b>❗ junto al logo:</b> la cadena tiene un compromiso del acuerdo comercial que todavía no tiene promo cargada.</li>
<li><b>Vistas:</b> Calendario (mes clásico), Por cadena (una fila por cadena) o Lista (tabla con estado y si la promo se vio en el clipping).</li></ul>`},
clip:{t:"Cómo leer el Clipping",b:`<p>Es el relevamiento diario de <b>Kyros y Kansas</b> en la web o app de cada cadena: precios, promos y si se cumple lo planificado. Se elige la cadena, se toca “⚡ Cargar relevamiento” y se completan solo los precios y promos que se ven. Se puede adjuntar la captura como respaldo.</p>
<ul><li><b>Tira de días:</b> el número azul es la cantidad de capturas cargadas ese día. Tocá un día para ver solo esas.</li>
<li><b>Lista / Final:</b> precio sin promo y precio que paga el cliente con la promo.</li>
<li><b>vs PSV:</b> diferencia del precio de lista contra nuestro precio sugerido. Verde = en objetivo, amarillo/rojo = por debajo, azul = por encima.</li>
<li><b>Planificado vs. visto:</b> cruza las promos del calendario con las capturas. ✓ se vio en alguna captura dentro de su vigencia; ! ya empezó y no aparece; · todavía no empezó.</li>
<li><b>Promos propias detectadas:</b> todas las promos de nuestras marcas que aparecieron en el mes, con el rango de días en que se vieron.</li>
<li><b>Marcas blancas y competencia:</b> si en una captura aparecen productos de la marca blanca que le fabricamos a la cadena (Cuisine & Co, Carrefour Classic, Dia) o de la competencia, se guardan en “También en la captura” y se analizan en la solapa Competencia.</li>
<li>Los precios de Kyros y Kansas pasan solos a Precio sugerido de venta.</li></ul>`},
psv:{t:"Cómo leer Precio sugerido de venta",b:`<p>El PSV es el precio objetivo en góndola. Esta solapa muestra, por cadena y producto, si el precio real está en objetivo, por debajo o por encima, para que comercial lo trabaje con cada cadena.</p>
<ul><li><b>Cambios de precio sugerido:</b> aumentos o cambios del PSV con fecha, para todas las cadenas o para una sola (ej. “desde el 02/11, en Coto, hummus Kyros a $4.900”). Desde esa fecha el nuevo valor pasa a ser el objetivo en toda la página, y el cambio aparece marcado en verde en el calendario.</li><li><b>Tolerancia:</b> margen aceptado (por defecto ±5%). Dentro de ese margen se considera “en objetivo”.</li>
<li><b>Comparar:</b> “precio de lista” compara el precio sin promo; “precio con promo” compara lo que paga el cliente.</li>
<li><b>Productos relevados:</b> cuántos productos tienen al menos un precio registrado en esa cadena hasta la fecha.</li>
<li><b>En objetivo:</b> porcentaje de esos productos que está dentro de la tolerancia.</li>
<li><b>Distribución:</b> barra con la proporción de productos muy por debajo (rojo), por debajo (amarillo), en objetivo (verde) y por encima (azul).</li>
<li><b>Desvío promedio:</b> promedio de las diferencias de cada producto contra su PSV. Negativo = la cadena vende, en promedio, más barato que el objetivo.</li>
<li><b>Alertas:</b> cada precio fuera de tolerancia. “Marcar avisado” registra que comercial ya fue notificado; si el precio cambia, la alerta vuelve a aparecer.</li>
<li><b>Tabla de precios:</b> último precio relevado de cada producto en cada cadena y su % contra el PSV. “No listado” = el producto no está en el surtido acordado.</li></ul>`},
comp:{t:"Cómo leer Competencia",b:`<p>Analiza las otras marcas que están en góndola junto a Kyros y Kansas, en dos bloques. Se llena con los relevamientos (la sección “Competencia” de la carga) o con “+ Cargar promo de competencia”.</p>
<ul><li><b>Marcas blancas que fabricamos:</b> la marca de cada cadena que producimos nosotros (Cuisine & Co, Carrefour Classic, Dia). Se compara su precio con nuestro producto equivalente; <b>brecha</b> negativa = la marca blanca está más barata. También se ven sus promos o acuerdos vigentes.</li><li><b>Marcas competidoras:</b> el resto de las marcas. Lo que sigue explica esa parte.</li><li><b>Productos vistos:</b> cantidad de registros de esa marca en el mes.</li><li><b>Con promo:</b> cuántos de esos tenían alguna promoción.</li>
<li><b>Desc. prom.:</b> descuento promedio que ofreció esa marca.</li><li><b>Precio prom.:</b> precio final promedio relevado.</li>
<li><b>Lectura rápida:</b> frases armadas automáticamente con los datos del mes: si somos más caros o más baratos que la competencia y si promocionamos más o menos, por categoría. Respeta los filtros de cadena y categoría.</li><li><b>Análisis del equipo:</b> espacio para escribir la conclusión del mes (o pedirle a Claude un borrador) y guardarla para que la vean comercial y gerencia.</li>
<li><b>Nuestro precio vs. competencia:</b> PSV promedio de nuestra línea contra el precio promedio de la competencia en esa categoría. No está ajustado por gramaje: para comparar bien, mirá presentaciones similares en el detalle.</li></ul>`}

function psvAt(pid,cid,fecha){const p=prodById(pid);if(!p||!p.psv)return null;let v=+p.psv;const f=fecha||TODAY;
  const ch=S.psvCambios.filter(x=>x.desde&&x.desde<=f&&(x.productos||[]).includes(pid)&&(!x.cadena||x.cadena===cid)).sort((a,b)=>a.desde.localeCompare(b.desde)||((a.cadena?1:0)-(b.cadena?1:0)));
  for(const x of ch){if(x.modo==="pct"&&num(x.pct)!=null)v=Math.round(v*(1+num(x.pct)/100));else if(num(x.precio))v=num(x.precio)}return v}
function psvChangeLabel(x){const ids=x.productos||[];const parts=[];
  for(const k of Object.keys(CATS)){const all=PROD().filter(p=>p.cat===k);const sel=all.filter(p=>ids.includes(p.id));if(!sel.length)continue;
    parts.push(sel.length===all.length?CATS[k].marca+" (toda la línea)":sel.length<=2?sel.map(p=>p.nombre).join(", "):`${sel.length} variedades ${CATS[k].marca}`)}
  const val=x.modo==="pct"?(num(x.pct)>0?"+":"")+String(x.pct).replace(".",",")+"%":fmt$(num(x.precio));
  return {prods:parts.join(" · ")||"Sin productos",val}}
function psvChangesHTML(){const list=S.psvCambios.slice().sort((a,b)=>b.desde.localeCompare(a.desde));
  return `<div class="panel" style="margin-bottom:16px"><div class="panel-h"><h3>Cambios de precio sugerido</h3><span class="small muted">Aumentos o cambios del PSV con fecha. Desde esa fecha, el nuevo valor se usa como objetivo en esta solapa, en las alertas y en Clipping, y aparece marcado en el calendario.</span></div>
  ${list.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>Desde</th><th>Cadena</th><th>Productos</th><th class="num">Nuevo PSV</th><th>Estado</th><th></th></tr></thead><tbody>
  ${list.map(x=>{const l=psvChangeLabel(x);const st=x.desde>TODAY?["Programado","info"]:["Vigente","ok"];return `<tr><td style="white-space:nowrap"><b>${fdate(x.desde)}/${x.desde.slice(2,4)}</b></td><td>${x.cadena?`<img class="minilogo" src="${CAD[x.cadena]?.logo||""}" alt=""> ${h(CAD[x.cadena]?.name||x.cadena)}`:"Todas las cadenas"}</td><td>${h(l.prods)}<div class="small muted">${h((x.productos||[]).map(id=>prodById(id)?.nombre||id).join(", "))}</div>${x.nota?`<div class="small muted">${h(x.nota)}</div>`:""}</td><td class="num"><b>${l.val}</b></td><td><span class="tag ${st[1]}">${st[0]}</span></td><td><button class="btn small" data-psvc="${x.id}">Editar</button></td></tr>`}).join("")}</tbody></table></div>`
  :`<div class="panel-b"><p class="muted small" style="margin:0">No hay cambios cargados. Ejemplo: “desde el 02/11, en Coto, el hummus Kyros pasa de $4.600 a $4.900”.</p></div>`}</div>`}
function openPsvCambio(x){
  const isNew=!x;const d=x?JSON.parse(JSON.stringify(x)):{desde:"",cadena:"",productos:[],modo:"precio",precio:"",pct:"",nota:""};const dlg=$("#dlg");

    </fieldset>
    <label>Tipo de cambio<select name="modo"><option value="precio" ${d.modo!=="pct"?"selected":""}>Nuevo precio fijo</option><option value="pct" ${d.modo==="pct"?"selected":""}>Aumento en %</option></select></label>
