/* ---------- IMPORTAR EXCEL ---------- */
let XLSXP=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve(window.XLSX);if(XLSXP)return XLSXP;
  XLSXP=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";sc.onload=()=>res(window.XLSX);sc.onerror=()=>{XLSXP=null;rej(new Error("No se pudo cargar el lector de Excel"))};document.head.append(sc)});return XLSXP}
const XL_COLS=["Fecha","Cadena","Tipo","Marca","Producto","Categoría","Precio de lista","Promo","Precio con promo"];
function xlDate(v){if(v instanceof Date&&!isNaN(v))return iso(new Date(v.getFullYear(),v.getMonth(),v.getDate()));
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
  const t=String(v||"").trim();let m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){const y=m[3].length===2?"20"+m[3]:m[3];return `${y}-${pad(+m[2])}-${pad(+m[1])}`}
  m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[1]}-${m[2]}-${m[3]}`:""}
function xlCadena(v){const n=normTxt(v);if(!n)return null;const c=CADENAS.find(c=>normTxt(c.name)===n||c.id===n||normTxt(c.name).replace(/ /g,"")===n.replace(/ /g,""));return c?c.id:null}
function xlTipo(v){const n=normTxt(v);if(/blanca|propia de la cadena|mb/.test(n))return "mp";if(/compet/.test(n))return "comp";if(/nuestr|propi|kyros|kansas|delidips/.test(n)||!n)return "own";return "comp"}
function xlCat(v,prod){const n=normTxt(v+" "+prod);if(/hummus|babaganush/.test(n))return "hummus";if(/pan/.test(normTxt(v))||/^pan /.test(normTxt(prod)))return "panificados";if(/salsa|ketchup|aderezo|mayonesa|aioli|mostaza|barbacoa|chimichurri|vinagreta|cheddar|caesar/.test(n))return "salsas";return "otra"}
function xlOwnPid(prod,cat){const n=normTxt(prod);const ex=PROD().find(p=>normTxt(p.nombre)===n);if(ex)return ex.id;return guessPid({producto:prod,categoria:cat})}
function parseXL(rows){
  const out=[],warn=[];
  rows.forEach((r,i)=>{const line=i+2;const g=k=>{const key=Object.keys(r).find(x=>normTxt(x)===normTxt(k));return key!=null?r[key]:""};
    const prod=String(g("Producto")||"").trim(),lista=g("Precio de lista"),fin=g("Precio con promo"),mec=String(g("Promo")||"").trim();
    if(!prod&&!lista&&!fin)return;
    const fecha=xlDate(g("Fecha"));const cid=xlCadena(g("Cadena"));
    if(!fecha){warn.push(`Fila ${line}: falta la fecha o no se entiende ("${g("Fecha")}")`);return}
    if(!cid){warn.push(`Fila ${line}: cadena desconocida ("${g("Cadena")}")`);return}
    if(num(lista)==null&&num(fin)==null){warn.push(`Fila ${line}: ${prod||"producto"} sin precio`);return}
    const tipo=xlTipo(g("Tipo"));const cat=xlCat(g("Categoría"),prod);const marca=String(g("Marca")||"").trim();
    const r2=calcRow(lista,mec,fin);let item;
    if(tipo==="own"){const pid=xlOwnPid(prod,cat);if(!pid){warn.push(`Fila ${line}: no encontré "${prod}" en nuestro catálogo (se cargó como competencia)`)}
      const p=pid&&prodById(pid);item=p?{producto:p.nombre,marca:CATS[p.cat].marca,categoria:p.cat,propio:true,productoId:pid,...r2}:{producto:prod,marca:marca||"Sin marca visible",categoria:cat,propio:false,productoId:null,...r2}}
    else if(tipo==="mp"){const mp=mpOf(cid)||marca||"Marca blanca";const pid=guessPid({producto:prod,categoria:cat});item={producto:prod,marca:mp,categoria:cat,propio:false,mp:true,productoId:pid,...r2}}
    else item={producto:prod,marca:marca||"Sin marca visible",categoria:cat,propio:false,productoId:null,...r2};
    out.push({fecha,cid,item:{presentacion:"",vigencia:"",...item}})});
  return {out,warn}}

function brandKey(m){const k=normTxt(m).replace(/[^a-z0-9]/g,"");return !k||(/^(sinmarca|novisible|desconocida)/.test(k)||/^(nd|na|sm)$/.test(k))?"_sm":k}
function dlDist(a,b){if(Math.abs(a.length-b.length)>1)return 9;const d=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[a.length][b.length]}
function brandCanon(items){const cnt=new Map(),names=new Map();
  for(const i of items){const k=brandKey(i.marca);cnt.set(k,(cnt.get(k)||0)+1);const nm=names.get(k)||new Map();const o=String(i.marca||"").trim();if(o)nm.set(o,(nm.get(o)||0)+1);names.set(k,nm)}
  const keys=[...cnt.keys()].sort((a,b)=>cnt.get(b)-cnt.get(a));const map=new Map(),heads=[];
  for(const k of keys){const hd=k==="_sm"?null:heads.find(x=>x.length>=4&&k.length>=4&&dlDist(x,k)<=1);if(hd)map.set(k,hd);else{map.set(k,k);heads.push(k)}}
  const display=new Map();for(const hd of new Set(map.values())){if(hd==="_sm"){display.set(hd,"Sin marca visible");continue}const all=new Map();
    for(const [k,h2] of map)if(h2===hd)for(const [o,n] of names.get(k)||[])all.set(o,(all.get(o)||0)+n);
    const best=[...all.entries()].sort((a,b)=>(b[1]-a[1])||((a[0]===a[0].toUpperCase())-(b[0]===b[0].toUpperCase())))[0];display.set(hd,best?best[0]:hd)}
  return m=>display.get(map.get(brandKey(m))||brandKey(m))||String(m||"Sin marca visible")}

function insightData(items){

      productosNuestrosRelevados:own.length,precioPromNuestro:avg(op),pctNuestrosConPromo:own.length?opromo.length/own.length*100:null,descPromNuestro:avg(odesc.length?odesc:caldesc),

  });

    const avgC=cp.reduce((a,b)=>a+b,0)/cp.length;const avgO=own.length?own.reduce((a,p)=>a+psvAt(p.id,S.compCadena||"",TODAY),0)/own.length:null;
    const mn=Math.min(...cp),mx=Math.max(...cp);
    out+=`<div style="margin-bottom:14px"><div style="font-weight:600"><span class="catdot" style="background:${CATS[k].color}"></span>${CATS[k].name}</div>
      <div class="small">Competencia: ${fmt$(mn)} – ${fmt$(mx)} · promedio <b>${fmt$(avgC)}</b></div>
      ${avgO?`<div class="small">PSV promedio ${h(CATS[k].marca)}: <b>${fmt$(avgO)}</b> <span class="d ${avgO>avgC?"warn":"ok"}">(${fmtPct((avgO-avgC)/avgC*100)} vs competencia)</span></div>`:`<div class="small muted">PSV de ${h(CATS[k].marca)} a completar.</div>`}
      <div class="small muted">Sin ajustar por gramaje: compará presentaciones similares en el detalle.</div></div>`}
  return out||`<p class="muted small">Aparece cuando haya precios de competencia en el mes.</p>`;
}
function openCompImg(){
  const dlg=$("#dlg");const d=ym()===TODAY.slice(0,7)?TODAY:ym()+"-01";let cad=S.compCadena||S.clipCadena||CADENAS[0].id;
  const bandSel=()=>BANDERAS[cad]?`<label>Bandera<select id="ciBand">${BANDERAS[cad].map(b=>`<option>${b}</option>`).join("")}</select></label>`:"";
  dlg.innerHTML=`<form method="dialog" style="display:contents"><div class="dlg-h"><h3>Cargar competencia por imagen</h3><button class="iconbtn" value="x" formnovalidate aria-label="Cerrar">×</button></div>
  <div class="dlg-b"><p class="small muted" style="margin-top:0">Subí capturas de la web o app de la cadena. La página lee cada imagen y separa sola los productos: la competencia aparece en esta solapa, y si en la imagen hay productos nuestros o de la marca blanca que fabricamos, también se cargan en Clipping y en Precio sugerido de venta.</p>
  ${P.imgOK?"":`<p class="small" style="color:var(--warn)">La lectura automática no está disponible ahora (falta dar permiso para usar Claude). Las imágenes se guardan y los datos se cargan a mano con “Editar datos” en Clipping.</p>`}
  <div class="form"><label>Cadena<select id="ciCad">${CADENAS.map(c=>`<option value="${c.id}" ${c.id===cad?"selected":""}>${h(c.name)}</option>`).join("")}</select></label>
  <label>Fecha de la captura<input type="date" id="ciFecha" value="${d}"></label><div id="ciBandBox" class="full">${bandSel()}</div></div>
  <div class="drop" id="ciDrop" tabindex="0" role="button" style="margin-top:14px"><strong>Elegí o arrastrá las imágenes</strong><span class="muted">Podés subir varias juntas</span><input type="file" id="ciFile" accept="image/*" multiple hidden></div></div>
  <div class="dlg-f"><div class="spacer"></div><button class="btn" value="x" formnovalidate>Cerrar</button></div></form>`;
  const sel=dlg.querySelector("#ciCad");sel.onchange=()=>{cad=sel.value;dlg.querySelector("#ciBandBox").innerHTML=bandSel()};
  const go=files=>{files=[...files].filter(f=>f.type.startsWith("image/"));if(!files.length)return;S.clipCadena=cad;const fecha=dlg.querySelector("#ciFecha").value||TODAY;const band=dlg.querySelector("#ciBand")?.value||"";
    dlg.close();toast(`Leyendo ${files.length} imagen${files.length>1?"es":""} de ${CAD[cad].name}…`);handleFiles(files,fecha,band)};
  const drop=dlg.querySelector("#ciDrop"),fi=dlg.querySelector("#ciFile");
  drop.onclick=()=>fi.click();drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fi.click()}};
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();go(e.dataTransfer.files)};fi.onchange=()=>go(fi.files);
  dlg.showModal();
}
function openComp(){
  const dlg=$("#dlg");const d=ym()===TODAY.slice(0,7)?TODAY:ym()+"-01";
  dlg.innerHTML=`<form method="dialog" id="cf"><div class="dlg-h"><h3>Promo o precio de competencia</h3><button class="iconbtn" value="x" formnovalidate aria-label="Cerrar">×</button></div>
  <div class="dlg-b"><div class="form">
    <label>Cadena<select name="cadena">${CADENAS.map(c=>`<option value="${c.id}" ${S.compCadena===c.id?"selected":""}>${c.name}</option>`).join("")}</select></label>
    <label>Fecha<input type="date" name="fecha" value="${d}"></label>
    <label>Categoría<select name="categoria">${Object.entries(CATS).map(([k,c])=>`<option value="${k}">${c.name}</option>`).join("")}</select></label>
    <label>Marca<input type="text" name="marca" required placeholder="ej. Hellmann's"></label>
    <label class="full">Producto<input type="text" name="producto" required placeholder="ej. Hummus clásico"></label>
    <label>Presentación<input type="text" name="presentacion" placeholder="ej. 250g"></label>
    <label>Promo<input type="text" name="mecanica" placeholder="ej. 2x1"></label>
    <label>Precio de lista $<input type="number" name="precioLista" min="0"></label>
    <label>Precio final $<input type="number" name="precioFinal" min="0"></label>
  </div></div><div class="dlg-f"><div class="spacer"></div><button class="btn" value="x" formnovalidate>Cancelar</button><button class="btn primary" value="ok">Guardar</button></div></form>`;
  dlg.querySelector("#cf").onsubmit=async e=>{if(e.submitter?.value!=="ok")return;const fd=Object.fromEntries(new FormData(e.target));
    fd.precioLista=num(fd.precioLista);fd.precioFinal=num(fd.precioFinal)??fd.precioLista;fd.by=P.me||"";await Store.put("competencia",uid(),fd);toast("Guardado en Competencia")};
  dlg.showModal();
}

boot();
